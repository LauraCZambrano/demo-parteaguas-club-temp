<!doctype html>
<html lang="es">
  <head>
    <!--
      Demo copy of the parteaguas.club frontend reading a Tarimah feed (Netlify).
      No Google Tag Manager / Analytics: that measurement belongs to Parteaguas.
      Kept out of search engines on purpose (also X-Robots-Tag in netlify.toml).
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Demo · columnas desde Tarimah</title>
    <meta name="description" content="Demo de una web propia que muestra columnas publicadas en Tarimah." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
